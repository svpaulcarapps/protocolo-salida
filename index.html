<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c4272">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Protocolo de salida</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#f5f7fa; color:#1f2a37;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; align-items:center; }
  .top { width:100%; background:#1c4272; border-bottom:6px solid #eaa62c; color:#fff; }
  .top .wrap { max-width:560px; margin:0 auto; padding:18px 20px; display:flex; align-items:center; gap:16px; }
  .logo { width:72px; height:72px; border-radius:18px; background:#fff; border:3px solid #fff; object-fit:cover; }
  .top h1 { font-size:26px; margin:0; font-weight:800; }
  .top p { margin:4px 0 0; font-size:16px; opacity:.9; }
  .caja { margin-top:48px; width:100%; max-width:380px; background:#fff; border:2px solid #d3dbe6;
    border-radius:24px; padding:28px; text-align:center; }
  .caja h2 { margin:0 0 6px; font-size:22px; color:#1c4272; }
  .caja p { margin:0 0 22px; color:#5b6b7f; font-size:16px; }
  input[type=password] { width:100%; font-size:28px; letter-spacing:.3em; text-align:center;
    padding:14px; border:2px solid #d3dbe6; border-radius:16px; }
  button { width:100%; margin-top:16px; border:0; border-radius:16px; padding:16px;
    font-size:20px; font-weight:700; background:#eaa62c; color:#1f2a37; cursor:pointer; }
  .error { min-height:24px; margin-top:14px; color:#b42318; font-size:16px; font-weight:600; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <img class="logo" src="icon-192.png" alt="Logo">
    <div>
      <h1>Protocolo de salida</h1>
      <p>Colegio San Vicente de Paúl</p>
    </div>
  </div>
</header>

<main class="caja" id="caja">
  <h2>Acceso</h2>
  <p>Introduce el código para entrar.</p>
  <form id="formPin">
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" autofocus>
    <button type="submit">Entrar</button>
  </form>
  <div class="error" id="error"></div>
</main>

<script>
  const PIN = '2503';
  const APP_URL = 'https://script.google.com/a/macros/svpaulcar.es/s/AKfycbxww7dUgyR_vTWDdNN1AJS_b4rbvw-7sn8ic4-HzWiAVWsxhK-M8KkXLJXuf7HbNtP_/exec';

  function abrirApp() {
    window.location.replace(APP_URL);
  }

  if (sessionStorage.getItem('protocolo_ok') === '1') {
    abrirApp();
  }

  document.getElementById('formPin').addEventListener('submit', e => {
    e.preventDefault();
    const valor = document.getElementById('pin').value.trim();
    if (valor === PIN) {
      sessionStorage.setItem('protocolo_ok', '1');
      abrirApp();
    } else {
      document.getElementById('error').textContent = 'Código incorrecto';
      document.getElementById('pin').value = '';
    }
  });
</script>
</body>
</html>
